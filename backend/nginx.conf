# ============================================================================
# 轻客管家 - nginx 配置（前端联调用）
#
# 文档 3.3 节「前后端联调」给出的配置，作用是把前端的 /api/ 请求代理到后端 Tomcat：
#   前端页面  http://localhost:90/api/depts
#     -> nginx  location ^~ /api/  +  rewrite 去掉 /api 前缀
#     -> 后端    http://localhost:8080/depts
#
# 用法：
#   1. 把课程资料里的前端工程压缩包解压到「无中文、无空格」的目录，例如 C:\qk-web
#   2. 把下面 root 改成解压后的 dist 目录绝对路径
#   3. 放到 nginx 的 conf\nginx.conf 里，或用 nginx -c 指定本文件
#   4. 在该目录下执行：nginx       （启动）
#      nginx -s stop              （停止）
#   5. 浏览器访问 http://localhost:90
# ============================================================================

server {
    # 前端页面端口（文档约定为 90，避开 8080 留给后端）
    listen 90;

    # 前端静态资源根目录 —— 需要改成实际解压后的 dist 目录
    root C:/qk-web/dist;
    index index.html;

    # 省略：证书、日志、gzip 等配置

    # 把 /api/ 开头的请求转发给后端 Tomcat
    location ^~ /api/ {
        # rewrite：把 /api/depts 重写成 /depts，再转发
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://localhost:8080;
    }
}
