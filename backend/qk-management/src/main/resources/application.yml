# 项目名称
spring:
  application:
    name: qk-management

  # 数据库配置
  # 账号密码用环境变量注入：本地开发未设置时回落到默认值，
  # 部署时用 DB_USERNAME / DB_PASSWORD 环境变量覆盖，避免把凭据写进代码库
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qk}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

server:
  port: 8080

# mybatis-plus 相关配置
mybatis-plus:
  configuration:
    # 开启 mybatis 的日志输出（SQL 打印到控制台）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启 mybatis 的驼峰映射
    map-underscore-to-camel-case: true
  # xml 映射文件路径
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

logging:
  level:
    com.qk: debug
